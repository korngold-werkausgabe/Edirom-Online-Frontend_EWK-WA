events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # APP_PATH is used as URL prefix. Support both layouts:
        # 1) app files physically under /usr/share/nginx/html/APP_PATH
        # 2) app files physically under /usr/share/nginx/html
        location / {
            rewrite ^/APP_PATH/?(.*)$ /$1 break;
            try_files /APP_PATH$uri /APP_PATH$uri/ $uri $uri/ /APP_PATH/index.html /index.html;
        }

        location /BACKEND_PATH {
            proxy_pass /BACKEND_URL;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}